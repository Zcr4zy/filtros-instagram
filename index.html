<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blending de Pixels - Photoshop Modes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h1 class="header-title">Blending de Pixels</h1>
            </div>
            <p class="header-subtitle">Modos de mesclagem estilo Photoshop</p>
        </header>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Sidebar Controls -->
            <aside class="sidebar">
                <div class="control-group">
                    <label class="control-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        Abrir Foto
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="file-input">
                </div>

                <div class="control-group">
                    <label class="control-label" for="blendMode">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        Lista de Modos
                    </label>
                    <select id="blendMode" class="select-input">
                        <optgroup label="Normal">
                            <option value="normal">Normal</option>
                        </optgroup>
                        <optgroup label="Escurecer">
                            <option value="darken">Darken</option>
                            <option value="multiply" selected>Multiply</option>
                            <option value="colorBurn">Color Burn</option>
                            <option value="linearBurn">Linear Burn</option>
                        </optgroup>
                        <optgroup label="Clarear">
                            <option value="lighten">Lighten</option>
                            <option value="screen">Screen</option>
                            <option value="colorDodge">Color Dodge</option>
                            <option value="linearDodge">Linear Dodge (Add)</option>
                        </optgroup>
                        <optgroup label="Contraste">
                            <option value="overlay">Overlay</option>
                            <option value="softLight">Soft Light</option>
                            <option value="hardLight">Hard Light</option>
                            <option value="vividLight">Vivid Light</option>
                            <option value="linearLight">Linear Light</option>
                            <option value="pinLight">Pin Light</option>
                            <option value="hardMix">Hard Mix</option>
                        </optgroup>
                        <optgroup label="Inversão">
                            <option value="difference">Difference</option>
                            <option value="exclusion">Exclusion</option>
                        </optgroup>
                        <optgroup label="Componente">
                            <option value="subtract">Subtract</option>
                            <option value="divide">Divide</option>
                        </optgroup>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">Cor de Blending</label>
                    <input type="text" id="colorText" value="#dc0404" class="color-hex-input" placeholder="#dc0404">
                    <input type="color" id="colorPicker" value="#dc0404" class="color-picker-hidden">
                </div>

                <div class="mode-info">
                    <p class="info-label">Modo Atual:</p>
                    <p id="currentMode" class="info-value">Multiply</p>
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-grid">
                <!-- Original Image -->
                <div class="canvas-container">
                    <h2 class="canvas-title">Foto Original</h2>
                    <div class="canvas-wrapper">
                        <div id="originalPlaceholder" class="placeholder">
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                            </svg>
                            <p class="placeholder-text">Carregue uma imagem para começar</p>
                        </div>
                        <canvas id="canvasOriginal" class="canvas"></canvas>
                    </div>
                </div>

                <!-- Blended Image -->
                <div class="canvas-container">
                    <h2 class="canvas-title">Foto com o Cálculo</h2>
                    <div class="canvas-wrapper">
                        <div id="blendedPlaceholder" class="placeholder">
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                            <p class="placeholder-text">O resultado aparecerá aqui</p>
                        </div>
                        <canvas id="canvasBlended" class="canvas"></canvas>
                    </div>
                    <button id="exportBtn" class="export-btn hidden">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Exportar PNG
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
