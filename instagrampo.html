<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGrampo</title>
    <link data-default-icon="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" rel="icon" sizes="192x192" href="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png">
    <link rel="stylesheet" href="src/styles/instagrampo.css">
    <link rel="stylesheet" href="src/styles/modalComponent.css">   
</head>
<body>
    <div class="sidebarEsquerda">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1024px-Instagram_logo.svg.png" alt="instagrampo" id="logo" title="instagram">
        <nav>
            <div class="sidebarIconsNav" title="Página Inicial">
                <i data-lucide="home" class="icon"></i>
                <span>
                    <b>Página Inicial</b>
                </span>
            </div>
            <div class="sidebarIconsNav" title="Pesquisa">
                <i data-lucide="search" class="icon"></i>
                <span>
                    Pesquisa
                </span>
            </div>
            <div class="sidebarIconsNav" title="Explorar">
                <i data-lucide="compass" class="icon"></i>
                <span>
                    Explorar
                </span>
            </div>
            <div class="sidebarIconsNav" title="Reels">
                <i data-lucide="square-play" class="icon"></i>
                <span>
                    Reels
                </span>
            </div>
            <div class="sidebarIconsNav" title="Mensagens">
                <i data-lucide="send" class="icon"></i>
                <span>
                    Mensagens
                </span>
            </div>
            <div class="sidebarIconsNav" title="Notificações">
                <i data-lucide="heart" class="icon"></i>
                <span>
                    Notificações
                </span>
            </div>
            <div class="sidebarIconsNav" title="Criar">
                <button id="btnCriar">
                    <i data-lucide="square-plus" class="icon"></i>
                    <span>
                        Criar
                    </span>
                </button>
            </div>
            <div class="sidebarIconsNav" title="Perfil">
                <i data-lucide="circle-user-round" class="icon"></i>
                <span>
                    Perfil
                </span>
            </div>
        </nav>
    </div>
    <div class="content-center">
        <div class="div-storys">
            <img src="src/images/meninoNey.jpeg" title="neymarjr">
            <img src="src/images/sydney.jpeg" title="sydneysweeney">
            <img src="src/images/TeViNaGran.jpg" title="tevinagran">
            <img src="src/images/anaDeArmas.jpeg" title="anadearmas">
            <img src="src/images/ronaldo.jpeg" title="ronaldo">
            <img src="src/images/nhonho.jpeg" onclick="nhonho()" title="nhonho">
        </div>
        <div class="posts" id="posts">
        </div>
    </div>
</body>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="src/scripts/jquery-3.7.1.min.js"></script>
<script src="src/scripts/modalComponent.js"></script>
<script src="src/scripts/instagrampo.js"></script>
</html>
